name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: investigator-api, context: platform-be }
          - { image: investigator-web, context: web }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # With a GCP project configured, the same build is also pushed to Artifact Registry,
      # which is where Cloud Run pulls from.
      - id: gcp
        if: vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
      - if: vars.GCP_PROJECT_ID != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
            ${{ vars.GCP_PROJECT_ID != '' && format('{0}-docker.pkg.dev/{1}/{2}-images/{3}', vars.GCP_REGION, vars.GCP_PROJECT_ID, vars.GCP_NAME_PREFIX, matrix.image) || '' }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=staging
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:staging
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # Deploys the new api and web images to Cloud Run. Runs only when the repository variables
  # written by `terraform output github_variables` (terraform/gcp) are set. The gateway is not built here: it
  # is a pinned upstream image managed by Terraform (terraform/gcp).
  deploy-demo:
    needs: images
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Deploy the API
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_NAME_PREFIX }}-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_NAME_PREFIX }}-images/investigator-api:${{ steps.tag.outputs.tag }}
      - name: Deploy the web app
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_NAME_PREFIX }}-web
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_NAME_PREFIX }}-images/investigator-web:${{ steps.tag.outputs.tag }}
