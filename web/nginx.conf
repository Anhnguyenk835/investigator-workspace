# Same-origin topology: the web app and the API share one host, so session cookies are
# first-party and no CORS is involved. The API is addressed as `api` (the compose service).
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # add_header does not inherit into a location that sets its own, so the shared ones are a snippet.
  location = /healthz { access_log off; return 200 "ok\n"; }

  # /api/<path> reaches the backend as /<path>. Streams (chat answers, run events) must not
  # be buffered, or they arrive all at once at the end.
  location /api/ {
    proxy_pass http://api:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Hashed build files never change; the page itself must always be fresh.
  location /assets/ {
    include /etc/nginx/conf.d/security.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/security.inc;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
