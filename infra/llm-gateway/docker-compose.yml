# Self-contained: the gateway's postgres holds virtual keys and spend only.
services:
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.99.0
    ports:
      # localhost only: the master key is an admin credential.
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      STORE_MODEL_IN_DB: "False"
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000", "--telemetry", "False"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data

volumes:
  litellm-postgres-data:
