[project]
name = "investigator-be"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50.0.2",
  "fastapi>=0.143.2",
  "httpx>=0.28.1",
  "langgraph>=1.2.15",
  "langgraph-checkpoint-postgres>=3.2.0",
  "openai>=1.60",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic>=2.9",
  "pyjwt>=2.8",
  "pydantic-settings>=2.6",
  "pypdf>=6.21.0",
  "python-docx>=1.2.0",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "langgraph-cli[inmem]>=0.4.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live_redteam: calls the real gateway; run with LIVE_REDTEAM=1"]

[tool.mypy]
strict = true
mypy_path = "src"

# langgraph's add_node overloads reject nodes typed on a pydantic state under strict
# mypy ("_Node[Never]"); the nodes are checked on their own signatures.
[[tool.mypy.overrides]]
module = "investigator.agents.investigation.subgraphs.*"
disable_error_code = ["arg-type", "call-overload"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C408", "RUF059", "BLE001"]
