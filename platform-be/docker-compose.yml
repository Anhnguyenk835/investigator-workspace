services:
  db:
    image: postgres:17-alpine
    ports:
      # 5442: 5432/5433 are commonly taken by other local projects.
      - "127.0.0.1:5442:5432"
    environment:
      POSTGRES_USER: investigator
      POSTGRES_PASSWORD: investigator
      POSTGRES_DB: investigator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investigator"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - investigator-postgres-data:/var/lib/postgresql/data

volumes:
  investigator-postgres-data:
